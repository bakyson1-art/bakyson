[build]
  builder = "dockerfile"
  dockerfile = "Dockerfile"

[deploy]
  healthcheckPath = "/api/health"
  healthcheckTimeout = 100
  healthcheckInterval = 30
  restartPolicyType = "on_failure"
  maxRestarts = 10
  numReplicas = 1

[services]
  web = { source = "." }

[[services.postgresql]]
  name = "bakyson-db"
  plan = "postgresql"

[[services.redis]]
  name = "bakyson-redis"
  plan = "redis"
